.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<script type="application/json" id="codex-visualization-widget-state">{}</script>
<script>(() => {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>

#lexiu-blackgold-plan .fire-progress{display:flex;justify-content:space-between;align-items:end;padding:14px 0 18px;border-bottom:1px solid var(--p-line);margin-bottom:14px}
#lexiu-blackgold-plan .fire-progress strong{font-size:32px;color:var(--p-accent)}
#lexiu-blackgold-plan .fire-directory-list{display:flex;flex-direction:column;gap:10px}
#lexiu-blackgold-plan .fire-directory-card{background:var(--p-surface);border:1px solid var(--p-line);border-radius:var(--p-radius);overflow:hidden}
#lexiu-blackgold-plan .fire-directory-button{display:grid;grid-template-columns:54px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;width:100%;min-height:74px;padding:13px 14px;text-align:left;border:0;border-radius:0;background:transparent}
#lexiu-blackgold-plan .fire-directory-button strong{grid-row:1 / span 2;font-size:18px;color:var(--p-accent)}
#lexiu-blackgold-plan .fire-directory-button span{font-weight:600}
#lexiu-blackgold-plan .fire-directory-button small{color:var(--p-muted);font-size:12px}
#lexiu-blackgold-plan .fire-detail-card .p-empty{margin-bottom:14px}
</style>
<style id="mobile-prototype-overrides">
:root { color-scheme: light; }
html, body { margin: 0; min-width: 0; background: #151611; }
body { padding: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow-x: hidden; }
.prototype-picker { position: sticky; top: 0; z-index: 20; padding: 12px 14px 10px; background: #151611; color: #f5eddb; border-bottom: 1px solid #453b29; }
.prototype-picker-brand { display: flex; align-items: center; gap: 9px; }
.prototype-picker-brand img { width: 112px; height: 25px; object-fit: contain; filter: brightness(0) invert(1) sepia(.35) saturate(2.2); }
.prototype-picker-brand div { display: flex; flex-direction: column; gap: 1px; }
.prototype-picker-brand strong { font-size: 14px; letter-spacing: .08em; }
.prototype-picker-brand small, .prototype-picker-note { color: #cbbd9e; font-size: 11px; }
.prototype-picker-title { margin-top: 12px; font-size: 12px; color: #cbbd9e; }
.prototype-theme-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
.prototype-theme-tabs a { min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 7px 5px; border: 1px solid #594a31; border-radius: 10px; color: #e6dcc4; background: #24221c; text-decoration: none; font-size: 12px; text-align: center; }
.prototype-theme-tabs a[aria-current="page"] { color: #211b10; background: #d1ad63; border-color: #d1ad63; font-weight: 700; }
.prototype-role { display: flex; align-items: center; gap: 8px; margin-top: 9px; color: #cbbd9e; font-size: 12px; }
.prototype-role select { min-height: 38px; padding: 6px 9px; border: 1px solid #594a31; border-radius: 8px; color: #f5eddb; background: #24221c; }
.prototype-picker-note { margin: 8px 0 0; }
#lexiu-blackgold-plan { width: min(100%, 390px); margin: 0 auto; }
#lexiu-blackgold-plan .p-shell { width: 100%; max-width: 390px; min-height: calc(100vh - 142px); border: 0; border-radius: 0; overflow: clip; }
#lexiu-blackgold-plan .p-shell.device-phone .p-content { min-height: calc(100vh - 275px); }
#lexiu-blackgold-plan .p-shell.device-phone .p-module-grid,
#lexiu-blackgold-plan .p-shell.device-phone .p-lounge-modules { grid-template-columns: 1fr; }
#lexiu-blackgold-plan .p-shell.device-phone .p-module { min-height: 76px; flex-direction: row; align-items: center; }
#lexiu-blackgold-plan .p-shell.device-phone .p-lounge-modules .p-module { min-height: 76px; flex-direction: row; align-items: center; }
#lexiu-blackgold-plan .p-shell.device-phone .p-btn { min-height: 44px; }
#lexiu-blackgold-plan .p-shell.device-phone .p-actions .p-btn { flex: 1 1 auto; }
@media (min-width: 700px) {
  body { background: #efeee9; }
  .prototype-picker { max-width: 760px; margin: 20px auto 0; border: 1px solid #d9d1c2; border-radius: 14px 14px 0 0; }
  #lexiu-blackgold-plan { box-shadow: 0 12px 35px rgb(35 31 23 / 18%); }
}
@media (max-width: 330px) {
  .prototype-picker { padding-inline: 10px; }
  .prototype-theme-tabs { gap: 4px; }
  .prototype-theme-tabs a { font-size: 11px; }
  #lexiu-blackgold-plan .p-shell.device-phone .p-content { padding-inline: 12px; }

<script>
const requestedTheme = new URLSearchParams(window.location.search).get('theme');
const ACTIVE_SCHEME = ['lounge', 'ledger', 'orbit'].includes(requestedTheme) ? requestedTheme : 'lounge';
const ACTIVE_LABEL = {lounge:'金曜掌上台', ledger:'浅雾清单', orbit:'蓝域掌控'}[ACTIVE_SCHEME];
const themeTab = document.querySelector('[data-theme-key="' + ACTIVE_SCHEME + '"]');
if (themeTab) themeTab.setAttribute('aria-current', 'page');
const activeSection = document.querySelector('[data-scheme]');
if (activeSection) { activeSection.dataset.scheme = ACTIVE_SCHEME; activeSection.setAttribute('aria-label', ACTIVE_LABEL); }
const P = {
  handlers: {},
  schemes: [ACTIVE_SCHEME],
  titles: {ledger: '清爽台账', orbit: '星轨工作台', lounge: '黑金门店'},
  accessPolicy: 'pending',
  esc: value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  now: () => '2026-10-04 16:30',
  nextId: rows => Math.max(0, ...rows.map(x => Number(x.id) || 0)) + 1,
  icon: name => '<i data-lucide="' + P.esc(name) + '" aria-hidden="true"></i>',
  isAdmin: ctx => ctx.role === 'admin',
  canSeeParent(ctx,item) {
    if(!item)return false;
    if(P.isAdmin(ctx))return true;
    const user=ctx.db.users.find(x=>x.role===ctx.role);
    return (!item.review_status || item.review_status==='approved') || (user && [user.name,user.username].includes(item.created_by));
  },
  permission(ctx, ability) {
    if (ctx.role === 'admin') return true;
    if (ability === 'newAsset' || ability === 'newInventory') return P.accessPolicy === 'staff-pending';
    return !['delete', 'review', 'drinks', 'users', 'backup', 'inventoryEdit', 'inventoryImage'].includes(ability);
  },
  formatExpiry(item) {
    if (item.expiry_mode === 'longterm') return {level:'longterm', label:'长期有效'};
    if (item.expiry_mode === 'unknown') return {level:'unknown', label:'有效期待确认'};
    const days = Math.round((new Date(item.expiry_date + 'T12:00:00') - new Date('2026-10-04T12:00:00')) / 86400000);
    if (days < 0) return {level:'expired', label:'已过期'};
    if (days <= 15) return {level:'warn', label:'15 天内到期'};
    return {level:'normal', label:'有效期正常'};
  },
  badge(text, tone = 'neutral') { return '<span class="p-badge tone-' + P.esc(tone) + '">' + P.esc(text) + '</span>'; },
  button(label, act, attrs = {}, tone = '') {
    return '<button type="button" class="p-btn cursor-interaction' + (tone ? ' tone-' + P.esc(tone) : '') + '" data-act="' + P.esc(act) + '"' + Object.entries(attrs).map(([k,v]) => ' data-' + P.esc(k) + '="' + P.esc(v) + '"').join('') + '>' + label + '</button>';
  },
  empty(text) { return '<div class="p-empty">' + P.icon('inbox') + '<p>' + P.esc(text) + '</p></div>'; },
  table(headers, rows) {
    return '<div class="p-table-wrap"><table class="p-table"><thead><tr>' + headers.map(x=>'<th>' + P.esc(x) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r=>'<tr>' + r.map((v,i)=>'<td data-label="' + P.esc(headers[i]) + '">' + v + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  },
  field(ctx, name, label, type = 'text', value = '', options = {}) {
    const val = Object.prototype.hasOwnProperty.call(ctx.s.draft, name) ? ctx.s.draft[name] : value;
    const id = ctx.scheme + '-' + ctx.s.route + '-' + name;
    let control = '';
    const common = ' id="' + P.esc(id) + '" name="' + P.esc(name) + '"' + (options.required ? ' required' : '') + (options.placeholder ? ' placeholder="' + P.esc(options.placeholder) + '"' : '') + (options.min != null ? ' min="' + options.min + '"' : '') + (options.max != null ? ' max="' + options.max + '"' : '') + (options.step != null ? ' step="' + options.step + '"' : '');
    if (type === 'select') control = '<select' + common + '>' + (options.choices || []).map(opt => {const o = typeof opt === 'object' ? opt : {value:opt,label:opt}; return '<option value="' + P.esc(o.value) + '"' + (String(o.value) === String(val) ? ' selected' : '') + '>' + P.esc(o.label) + '</option>';}).join('') + '</select>';
    else if (type === 'textarea') control = '<textarea' + common + ' rows="' + (options.rows || 3) + '">' + P.esc(val) + '</textarea>';
    else control = '<input' + common + ' type="' + P.esc(type) + '" value="' + P.esc(val) + '"' + (type === 'number' ? ' inputmode="numeric"' : '') + (type === 'password' ? ' autocomplete="off"' : '') + '>';
    return '<div class="p-field"><label for="' + P.esc(id) + '">' + P.esc(label) + (options.required ? ' <span class="p-required">必填</span>' : '') + '</label>' + control + '</div>';
  },
  form(ctx, config) {
    const primary = (config.primary || []).join('');
    const optional = (config.optional || []).join('');
    const stage = ctx.s.step || 1;
    let body = '';
    if (ctx.scheme === 'lounge' && optional) {
      body = '<div class="p-form-step"><span class="' + (stage === 1 ? 'active' : '') + '">1 · 主要信息</span><span class="' + (stage === 2 ? 'active' : '') + '">2 · 补充与确认</span></div><div class="p-form-grid">' + (stage === 1 ? primary : optional) + '</div>';
      if (stage === 2) {
        const summary=Object.entries(ctx.s.draft).filter(([key,val]) => val && !['password','current','new','repeat','demo_file','file_selected','image_selected','preview_large','selected_kind'].includes(key)).slice(0,7).map(([key,val]) => '<span>' + P.esc(P.fieldNames[key] || key) + '：' + P.esc(val) + '</span>').join('');
        if(summary) body += '<div class="p-confirm-summary"><h3>已填写的主要信息</h3>' + summary + '</div>';
        if(ctx.s.draft.demo_file && !optional.includes('p-upload-box')) body += P.uploadBox(ctx,{kind:ctx.s.draft.selected_kind || 'certificate',entity:ctx.s.route.startsWith('drink-')?'drink':ctx.s.route.startsWith('inventory-')?'inventory':'cert',id:ctx.s.id,accept:[],summary:true});
      }
    } else if (ctx.scheme === 'orbit' && optional) body = '<div class="p-form-grid">' + primary + '</div><details class="p-optional"' + (ctx.s.optionalOpen ? ' open' : '') + '><summary>补充信息与附件（可选）</summary><div class="p-form-grid">' + optional + '</div></details>';
    else body = '<div class="p-form-grid">' + primary + optional + '</div>';

  photo(kind, name) {

  fileType(file) {
    const name=typeof file==='string'?file:(file?.original_name || file?.name || '');

    if(file?.is_image || ['png','jpg','jpeg','gif','webp','bmp'].includes(ext)) return 'image';
    if(ext==='pdf')return 'pdf';
    if(['doc','docx'].includes(ext))return 'word';
    if(['xls','xlsx'].includes(ext))return 'excel';
    return 'file';
  },

  P.stock = function (ctx) {

      default: return null;
    }
  };

  function validateInventory(values, editing, existing) {
    var name = String(values.name || '').trim(), category = values.category || '其它';
    var safety = integer(values.safety_stock == null || values.safety_stock === '' ? 0 : values.safety_stock, 0);
    var mode = values.expiry_mode || 'unknown';
    var warnDays = editing ? integer(values.warn_days == null ? (existing.warn_days == null ? 15 : existing.warn_days) : values.warn_days, 0) : 15;
    if (!name) return { error: '请填写物品名称。' };
    if(String(values.unit || '个').trim().length>10)return {error:'单位最多 10 个字。'};
    if (categories.indexOf(category) < 0) return { error: '请选择已有物品分类。' };
    if (safety === null) return { error: '安全库存必须是非负整数。' };
    if (['date', 'longterm', 'unknown'].indexOf(mode) < 0) return { error: '请选择有效期方式。' };
    if (warnDays === null || warnDays > 3650) return { error: '提前提醒天数必须是 0 到 3650 之间的整数。' };
    if (mode === 'date' && !validDate(values.expiry_date)) return { error: '有明确到期日时，请填写有效的过期日期。' };
    return { item: { name: name, category: category, spec: String(values.spec || '').trim(), unit: String(values.unit || '个').trim() || '个', safety_stock: safety,
      expiry_mode: mode, expiry_date: mode === 'date' ? values.expiry_date : '', warn_days: warnDays, location: String(values.location || '').trim(), note: String(values.note || '') } };
  }
  function addLog(ctx, item, action, delta, after, values) {
    item.logs = item.logs || [];
    item.logs.push({ time: '2026-10-04 16:00', action: action, delta: delta, after: after, person: userName(ctx), supplier: String(values.supplier || ''), note: String(values.note || '') });
  }
  P.handlers['save-inventory'] = function (ctx, values) {
    if (!permission(ctx, 'newInventory')) return { error: '当前演示身份不允许新增物品。' };
    if (!beginSave(ctx)) return { error: '这一份表单已保存，请返回列表。' };
    var parsed = validateInventory(values), quantity = integer(values.quantity, 0);
    if (parsed.error) return parsed;
    if (quantity === null) return { error: '期初库存必须是非负整数。' };
    var image = selectedImage(ctx, values);
    if (administrator(ctx) && image.name && !image.valid) return { error: '物品图片只支持 JPG / PNG。' };
    var item = parsed.item;
    item.id = nextId(ctx.db.inventory); item.quantity = quantity; item.has_image = administrator(ctx) && image.valid;
    if (item.has_image) item.original_name = image.name;
    item.review_status = administrator(ctx) ? 'approved' : 'pending'; item.created_by=userName(ctx); item.logs = [];
    addLog(ctx, item, 'initial', quantity, quantity, {});
    ctx.db.inventory.push(item);
    if (!administrator(ctx)) {
      ctx.db.reviews = ctx.db.reviews || [];
      ctx.db.reviews.push({ id: nextId(ctx.db.reviews), kind: 'inventory', entity_id: item.id, name: item.name, detail: '新增物品 · ' + item.category, person: userName(ctx), time: '2026-10-04 16:00', status: 'pending' });
    }
    return finishSave(ctx, { route: 'inventory-detail', id: item.id, notice: administrator(ctx) ? '示例物品已保存，期初流水已记录。' : '示例已提交待审；通过后才能出入库。' });
  };
  P.handlers['save-inventory-edit'] = function (ctx, values) {
    if (!administrator(ctx)) return { error: '只有管理员能编辑物品档案。' };
    if (!beginSave(ctx)) return { error: '档案已保存。' };
    var item = find(ctx.db.inventory, ctx.s.id);
    if (!item || item.deleted) return { error: '这条物品记录已移除。' };
    var parsed = validateInventory(values, true, item);
    if (parsed.error) return parsed;
    Object.keys(parsed.item).forEach(function (key) { item[key] = parsed.item[key]; });
    return finishSave(ctx, { route: 'inventory-detail', id: item.id, notice: '示例档案已更新，库存数量与流水保持原状。' });
  };
  P.handlers['save-inventory-move'] = function (ctx, values) {
    if (!beginSave(ctx)) return { error: '这次登记已保存，请返回库存。' };
    var item = find(ctx.db.inventory, ctx.s.id), operation = ctx.s.op;
    if (!item || item.deleted || !approved(item)) return { error: '物品不存在或尚未审核通过，不能登记库存。' };
    if (['in', 'out', 'count'].indexOf(operation) < 0) return { error: '请从物品入口选择入库、出库或盘点。' };
    var amount = integer(operation === 'count' ? values.actual : values.qty, operation === 'count' ? 0 : 1);
    if (amount === null) return { error: operation === 'count' ? '实盘数必须是非负整数。' : '登记数量必须是正整数。' };
    if (operation === 'out' && amount > item.quantity) return { error: '库存不足：当前只有 ' + item.quantity + ' ' + item.unit + '。' };
    var before = Number(item.quantity), after = operation === 'count' ? amount : operation === 'in' ? before + amount : before - amount;
    if (!Number.isSafeInteger(after) || after < 0) return { error: '登记后库存超出可用范围。' };
    addLog(ctx, item, operation === 'in' ? 'purchase' : operation === 'out' ? 'consume' : 'adjust', after - before, after, values);

  P.handlers['save-drink'] = function (ctx, values) {
    if (!administrator(ctx)) return { error: '酒水单维护仅管理员可用。' };

    if (!image.valid) return { error: '酒单只支持 JPG / PNG 图片。' };
    var replacing = ctx.s.op === 'replace', page = replacing ? find(ctx.db.drinks, ctx.s.id) : null;

    page.original_name = image.name;

  };
  P.handlers['save-drink-note'] = function (ctx, values) {

      getContent(trigger).length === 0 ||

      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0

    pointerout: handleLeave,

    if (handledEvents.has(event)) return;

      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);

})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");

        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId

            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {

            "aria-current",

        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),

      next.addEventListener("click", () =>
        select((active + 1) % panels.length),

        if (event.key === "Escape" && picker.open) {
          event.preventDefault();

          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();

      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
